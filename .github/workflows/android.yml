name: Android CI

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      HAS_SIGNING_KEY: ${{ secrets.MEDVAULT_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      # Debug builds trust user-installed CAs and are for testing pull requests only.
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: medvault-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.MEDVAULT_KEYSTORE_BASE64 }}
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MEDVAULT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build release APK (minified; signed when signing secrets are set)
        env:
          MEDVAULT_KEYSTORE_PASSWORD: ${{ secrets.MEDVAULT_KEYSTORE_PASSWORD }}
          MEDVAULT_KEY_ALIAS: ${{ secrets.MEDVAULT_KEY_ALIAS }}
          MEDVAULT_KEY_PASSWORD: ${{ secrets.MEDVAULT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: medvault-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
