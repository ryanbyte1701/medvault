name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.SCANVAULT_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: scanvault-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.SCANVAULT_KEYSTORE_BASE64 }}
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SCANVAULT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build release APK (minified; signed when signing secrets are set)
        env:
          SCANVAULT_KEYSTORE_PASSWORD: ${{ secrets.SCANVAULT_KEYSTORE_PASSWORD }}
          SCANVAULT_KEY_ALIAS: ${{ secrets.SCANVAULT_KEY_ALIAS }}
          SCANVAULT_KEY_PASSWORD: ${{ secrets.SCANVAULT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: scanvault-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
