name: README screenshots

# Renders the README screenshots (real screens, fictional sample vault, dark theme) with
# Robolectric and uploads them as the `readme-screenshots` artifact. Copy them into
# docs/screenshots/ to update the README.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/src/test/java/com/scanvault/android/screenshots/**"
      - "app/src/test/resources/sample-vault/**"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Render screenshots
        run: ./gradlew --no-daemon testDebugUnitTest -Pscreenshots --tests 'com.scanvault.android.screenshots.*'
      - name: Print screenshots as base64 (for environments that can read logs but not artifacts)
        run: |
          for f in app/build/screenshots/*.png; do
            echo "SV-SHOT-BEGIN $(basename "$f")"; base64 -w 0 "$f"; echo; echo "SV-SHOT-END"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: readme-screenshots
          path: app/build/screenshots/*.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: screenshot-test-report
          path: app/build/reports/tests/
