services:
  scanvault:
    build: .
    image: scanvault:latest
    container_name: scanvault
    restart: unless-stopped
    ports:
      # Only reachable from this machine. Put an HTTPS reverse proxy (Caddy,
      # Traefik, nginx) in front of it for other devices; over plain http://
      # passwords and keys would cross the network in clear.
      - "127.0.0.1:8080:8080"
    volumes:
      - scanvault-data:/data
      # Optional "USB / local disk" backup destination: map a mounted disk or an
      # NFS mount from the host into /backups, e.g.
      # - /mnt/usb-backup:/backups/usb1
    environment:
      # Public URL the browser uses, needed for Google/Box OAuth redirects
      # when you are not on http://localhost:8080 (e.g. https://scans.example.com)
      SCANVAULT_PUBLIC_URL: ${SCANVAULT_PUBLIC_URL:-}
      SCANVAULT_MAX_UPLOAD_MB: ${SCANVAULT_MAX_UPLOAD_MB:-2048}
      # Trust X-Forwarded-Proto/For only from your reverse proxy. A proxy on
      # this host reaches the container from the Docker bridge (172.16.0.0/12);
      # the port above is bound to 127.0.0.1, so nothing else can connect.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1,172.16.0.0/12}
      # Lock the vault after this many idle minutes (0 = stay unlocked)
      SCANVAULT_AUTO_LOCK_MINUTES: ${SCANVAULT_AUTO_LOCK_MINUTES:-0}
      PUID: ${PUID:-10001}
      PGID: ${PGID:-10001}
      # Optional single sign-on provider (or add providers in Settings > Single sign-on):
      # SCANVAULT_OIDC_PRESET: authentik
      # SCANVAULT_OIDC_ISSUER: https://auth.example.com/application/o/scanvault/
      # SCANVAULT_OIDC_CLIENT_ID: scanvault
      # SCANVAULT_OIDC_CLIENT_SECRET_FILE: /run/secrets/scanvault_oidc_secret
      # Break-glass: re-enable password sign-in if it was turned off
      # SCANVAULT_FORCE_LOCAL_LOGIN: "1"
      # Remove the optional AI explanations entirely (they are off by default):
      # SCANVAULT_AI: "off"
      # Optional unattended unlock after restarts (see README trade-offs):
      # SCANVAULT_PASSPHRASE_FILE: /run/secrets/scanvault_passphrase
    # secrets:
    #   - scanvault_passphrase
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    # only for the entrypoint: fix /data ownership, then drop to PUID:PGID
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile: {soft: 65536, hard: 65536}

volumes:
  scanvault-data:

